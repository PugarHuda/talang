// Talang DecMan LocalNet: one synchronizer ("global", DecMan's default alias),
// one sequencer, one mediator, three participants. Ports follow DecMan's
// development layout: participant N has ledger 50N1 / admin 50N2 (N = 0,1,2),
// plus a JSON Ledger API on 76N1 for Talang's scripts.
//
// Ledger API auth is Canton's unsafe shared-secret HS256 ("unsafe" /
// https://canton.network.global), which is what DecMan's insecure mode signs.
// Local development only.
//
// Runs in the "canton" service of docker-compose.yml (Canton open source 3.5.8,
// the build in Splice 0.6.12, which DecMan's own localnet test targets): DecMan
// v1.13.0 pins protocol version 35, and the Canton 3.4.11 in the Daml SDK only
// speaks 34. APIs listen on 0.0.0.0 inside the container network; the compose
// file publishes them on 127.0.0.1 only.
_storage {
  type = postgres
  config {
    dataSourceClass = "org.postgresql.ds.PGSimpleDataSource"
    properties = {
      serverName = "postgres"
      portNumber = 5432
      user = "canton"
      password = "canton"
    }
  }
  parameters.max-connections = 8
}
_auth = [{
  type = unsafe-jwt-hmac-256
  secret = "unsafe"
  target-audience = "https://canton.network.global"
}]

canton {
  parameters.non-standard-config = yes
  // DecMan signs the governance submissions with the owner keys it generated on
  // each participant, which needs the vault key export (a preview command).
  features.enable-preview-commands = yes
  sequencers.sequencer1 {
    storage = ${_storage} { config.properties.databaseName = "sequencer1" }
    public-api { address = "0.0.0.0", port = 5101 }
    admin-api { address = "0.0.0.0", port = 5102 }
    sequencer.type = reference
    sequencer.config.storage = ${_storage} { config.properties.databaseName = "sequencer1_driver" }
  }
  mediators.mediator1 {
    storage = ${_storage} { config.properties.databaseName = "mediator1" }
    admin-api { address = "0.0.0.0", port = 5202 }
  }
  participants {
    participant1 {
      storage = ${_storage} { config.properties.databaseName = "participant1" }
      ledger-api { address = "0.0.0.0", port = 5001, auth-services = ${_auth}, user-management-service.additional-admin-user-id = "ledger-api-user", max-token-lifetime = Inf }
      admin-api { address = "0.0.0.0", port = 5002 }
      http-ledger-api { address = "0.0.0.0", port = 7601 }
    }
    participant2 {
      storage = ${_storage} { config.properties.databaseName = "participant2" }
      ledger-api { address = "0.0.0.0", port = 5011, auth-services = ${_auth}, user-management-service.additional-admin-user-id = "ledger-api-user", max-token-lifetime = Inf }
      admin-api { address = "0.0.0.0", port = 5012 }
      http-ledger-api { address = "0.0.0.0", port = 7611 }
    }
    participant3 {
      storage = ${_storage} { config.properties.databaseName = "participant3" }
      ledger-api { address = "0.0.0.0", port = 5021, auth-services = ${_auth}, user-management-service.additional-admin-user-id = "ledger-api-user", max-token-lifetime = Inf }
      admin-api { address = "0.0.0.0", port = 5022 }
      http-ledger-api { address = "0.0.0.0", port = 7621 }
    }
  }
}
